<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Captured Face
    </title>


    <style>

        body {

            margin: 0;

            padding: 0;

            font-family: Arial, sans-serif;

            background: #111;

            color: white;

            text-align: center;

        }


        .container {

            width: 90%;

            max-width: 700px;

            margin: 40px auto;

        }


        h1 {

            margin-bottom: 25px;

        }


        .preview {

            background: #222;

            padding: 15px;

            border-radius: 15px;

            display: inline-block;

        }


        .preview img {

            display: block;

            max-width: 100%;

            max-height: 500px;

            border-radius: 10px;

        }


        input[type="text"] {

            width: 90%;

            max-width: 400px;

            padding: 14px;

            margin-top: 25px;

            border-radius: 8px;

            border: none;

            font-size: 17px;

            box-sizing: border-box;

        }


        button {

            padding: 13px 25px;

            margin: 15px 5px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;

        }


        .save {

            background: #28a745;

            color: white;

        }


        .cancel {

            background: #dc3545;

            color: white;

        }


        .error {

            color: #ff6b6b;

            margin-top: 15px;

            margin-bottom: 15px;

        }


        .back {

            display: inline-block;

            margin-top: 20px;

            color: white;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>

        Captured Face

    </h1>


    <div class="preview">


        <img
            src="{{ image_url }}"
            alt="Captured face"
            onerror="
                this.style.display='none';
                document.getElementById('imageError').style.display='block';
            "
        >


        <div
            id="imageError"
            style="display:none;"
        >

            Unable to load captured image.

        </div>


    </div>


    {% if error %}

        <div class="error">

            {{ error }}

        </div>

    {% endif %}


    <!-- SAVE -->

    <form
        action="{{ url_for('save_face') }}"
        method="POST"
    >


        <input
            type="hidden"
            name="filename"
            value="{{ filename }}"
        >


        <br>


        <input
            type="text"
            name="person_name"
            placeholder="Enter person's name"
            required
            autocomplete="off"
            maxlength="100"
        >


        <br>


        <button
            type="submit"
            class="save"
        >

            Save Face

        </button>


    </form>


    <!-- CANCEL -->

    <form
        action="{{ url_for('cancel_face') }}"
        method="POST"
    >


        <input
            type="hidden"
            name="filename"
            value="{{ filename }}"
        >


        <button
            type="submit"
            class="cancel"
        >

            Retake / Cancel

        </button>


    </form>


    <a
        class="back"
        href="{{ url_for('face_recog') }}"
    >

        Back to Face Recognition

    </a>


</div>


</body>

</html>
